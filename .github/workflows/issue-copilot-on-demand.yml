name: Infrastructure Copilot On Demand

on:
  workflow_dispatch:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  copilot:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue &&
       contains(github.event.issue.labels.*.name, 'infrastructure-request')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue &&
       github.event.issue.pull_request == null &&
       github.event.comment.user.type != 'Bot' &&
       contains(github.event.issue.labels.*.name, 'infrastructure-request'))
    runs-on: ubuntu-latest
    steps:
      - name: Test trigger
        run: echo "Workflow firing OK"
