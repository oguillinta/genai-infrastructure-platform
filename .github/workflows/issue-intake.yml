name: Infrastructure Issue Intake

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  intake:
    if: |
      contains(
        github.event.issue.labels.*.name,
        'infrastructure-request'
      ) &&
      (
        github.event.action == 'opened' ||
        (
          github.event.action == 'labeled' &&
          github.event.label.name == 'infrastructure-request'
        )
      )

    runs-on: ubuntu-latest

    steps:
      - name: Acknowledge infrastructure request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}

        run: |
          set -euo pipefail

          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GH_REPO" \
            --body "$(cat <<'EOF'
          ## Infrastructure Platform — Request Received

          Your infrastructure request has been received.

          ### Supported AWS Infrastructure

          The platform currently supports:

          - **Amazon S3:** Secure object storage.
          - **Amazon SQS:** Asynchronous message queues.
          - **Amazon DynamoDB:** Managed NoSQL tables.

          ### Automated Processing

          The Infrastructure Copilot will:

          1. Analyze your infrastructure requirements using AI.
          2. Select a compatible Terraform module.
          3. Validate the required parameters.
          4. Request additional information if necessary.
          5. Generate an infrastructure repository from the template.
          6. Create a Pull Request containing the Terraform proposal.

          ### Important Notes

          - You can describe your requirements in natural language.
          - If information is missing, reply directly to this issue.
          - Terraform configurations are reviewed before deployment.
          - **No AWS resources are automatically provisioned.**

          The Infrastructure Copilot will process your request separately.
          EOF
          )"
